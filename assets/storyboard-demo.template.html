<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{课程标题}}</title>
<style>
body{margin:0;font:18px system-ui;color:#eee;background:#111}
#course-stage{min-height:100dvh;display:grid;place-items:center}
#scene-media{width:min(100%,960px);min-height:50dvh}
#task-surface{padding:24px;max-width:600px;background:#222}
button,input{font:inherit;padding:12px;margin:8px;max-width:85%}
[hidden]{display:none!important}
</style></head>
<body>
<main id="course-stage">
  <div id="scene-media" data-runtime-mode="storyboard_events">
    <figure id="storyboard-frame">{{已审阅分镜或等价教学材料}}</figure>
    <button id="open-interaction">{{当前对象入口}}</button>
    <section id="task-surface" tabindex="-1" hidden aria-label="当前任务">
      <p>{{真实题干与完整依据}}</p>
      <input id="response" aria-label="当前回答">
      <button id="submit-interaction" data-primary-action>{{提交当前判断}}</button>
      <button id="complete-interaction" data-primary-action hidden>{{查看反馈后继续}}</button>
      <button id="close-interaction">返回现场</button>
    </section>
  </div>
</main>
<script id="video-event-map" type="application/json">{{与独立文件相同的完整事件JSON}}</script>
<script src="runtime.js"></script>
</body></html>
